<script type="module">
/* ═══ RED LIGHT · a Multiplayer Agent starter ═══════════════════════════════════════════
 * Run while Hum-Bot sings. Freeze when it turns round. Party, 2–20 players; bots fill seats.
 *
 * WHERE THINGS ARE (search for the "── " headers):
 *   CONFIG ........ song and stare lengths, fake-outs, speed, how strict the stare is, bots
 *   CONNECTION .... MP_CONNECT, joining, the offline room, who is host
 *   FIELD ......... grass, start and finish lines, fences, trees
 *   HUM-BOT ....... the singing robot: body, face screens, antenna lamp, search beams, lasers
 *   RUNNERS ....... the player model, freeze poses, the zap fizz, name tags
 *   WATCHER ....... the song → turn → look → back cycle, worked out from timestamps
 *   ROUND (HOST) .. brief → play → over, deciding who moved (zap) and who finished.
 *                   Only the host writes these.
 *   BOTS .......... bot runners: they run, stop late now and then, fall for fake-outs
 *                   (the host runs them; in ?attract the same brain drives your runner)
 *   ME ............ running, stopping, reporting your own moves. Each player writes only its own.
 *   HUD & RESULTS . the light, the song notes, the race bar, results card, leaderboard
 *   INPUT & SOUND . keyboard, mouse, touch stick, WebAudio song and effects
 *
 * HOW THE MULTIPLAYER WORKS (a relay room: no server code):
 *   - Each player writes its OWN entity: `p` (one packed JSON field: round id, position,
 *     heading, animation, and `m` = the number of the last look it moved in) about 12 times a
 *     second, `hb` (heartbeat) once a second, and `n`/`c` (name, color) once.
 *   - The HOST is the lowest sessionId among live players (heartbeat seen in the last 3s),
 *     worked out every frame. Only the host writes the shared fields `game` (id, v, phase,
 *     timers, the watcher segment `w`, who finished and when, who got zapped) and `bots`
 *     (every bot's position, ~10 times a second). A new host adopts both and carries on.
 *   - The watcher is timestamps: `w` = {s: number, k: sing|turn|look|back, a: start, b: end,
 *     f: fake-out}. A turn always lasts turnMs, so every client knows exactly when a look
 *     starts even before the host's next write arrives (see phaseAt()).
 *   - Moving during a look: each player checks ITSELF (its own speed, from its own input) and
 *     reports the look's number in `p.m`. The host zaps on that report, and also zaps anyone
 *     whose published position drifts more than CONFIG.slack during a look. A zapped player
 *     fizzes, then puts ITSELF back on the start line; the host does the same for bots.
 *   - Finishing: the host sees a published position past the finish line and records it.
 *   - The only intent is "again" (start the next round sooner from the results card).
 *   - ?attract plays offline with bots only (the preview video is recorded from it).
 *   - Leaderboard "red-light-time": fastest finish (stored as boardBase - ms, higher = faster).
 */
import * as THREE from "three";

// ── CONFIG ──────────────────────────────────────────────────────────────────────────
const CONFIG = {

  briefMs: 3500,         // everyone lines up before the first song
  roundMs: 80000,        // the round ends after this long even if not everyone made it
  allHomeMs: 6000,       // once every person is across, the bots get this long to finish
  overMs: 9000,          // results before the next round
  singMs: [1600, 5200],  // how long a song lasts (random each time): run!
  turnMs: 650,           // Hum-Bot turning round: stop now
  lookMs: [1700, 3600],  // how long it stares: anyone moving gets zapped
  backMs: 350,           // turning back to sing (moving is safe again)
  fakeChance: 0.3,       // chance a song has a fake-out (the head twitches round, the music hiccups)
  fakeMs: 700,           // how long a fake-out lasts
  speed: 5.6,            // running speed, units/s
  accel: 26,             // how quickly you speed up and stop
  moveEps: 0.6,          // faster than this (units/s) during a look = moving
  slack: 0.9,            // the host also zaps anyone whose published spot drifts this far during a look...
  slackDelayMs: 300,     // ...measured from this long after the look starts (updates are in flight)
  stunMs: 1100,          // a zapped runner fizzes this long, then pops back to the start
  radius: 0.45,          // how wide a runner is
  fieldW: 24,            // the field is this wide...
  startZ: 26, finishZ: -24, // ...and runs from the start line to the finish line (toward Hum-Bot)
  botPace: [0.8, 1.0],   // bots run at this share of your speed (each bot picks one)
  botReact: [80, 470],   // ms a bot takes to stop after the turn starts...
  botSlip: 0.08,         // ...but this often it stops too late and gets zapped
  botSneak: 0.05,        // chance a bot takes a sneaky step during a look

const MELODY = [72, 76, 79, 76, 74, 77, 76, 72]; // Hum-Bot's song: 8 notes, played faster or slower to fit each song's length
const BOT_NAMES = ["Skip", "Pip", "Juno", "Dot", "Bix", "Rue", "Taz", "Momo", "Kit", "Zuzu", "Nell", "Ollie"];
const COLORS = ["#ff5d73", "#ff9f43", "#ffd23f", "#3fc78a", "#4da3ff", "#b77dff", "#ff6fb5", "#3fc7c0", "#a3e635", "#f97316", "#60a5fa", "#e879f9"];

// ── CONNECTION ──────────────────────────────────────────────────────────────────────
// The builder fills these in for this game. Downloaded from GitHub? Put your own pk_ key here.
const MP_CONNECT = {
  key: 'pk_REPLACE_ME',
  room: 'red-light',
  endpoint: 'wss://live.multiplayeragent.com',
  apiUrl: 'https://api.multiplayeragent.com',

const QS = new URLSearchParams(location.search), ATTRACT = QS.has("attract");

/** Same shape as the SDK client, kept in this tab: offline play and ?attract. */

    sessionId: id, state, offline: true,
    me: { set: (k, v) => put(state.entities.players[id], k, v) },

}

const isHost = () => performance.now() > hostHold && performance.now() - lastTick < 1000 && livePlayers()[0] === net.sessionId; // a tab whose loop has stopped doesn't host
const isBot = (id) => id[0] === "@"; // bot ids look like "@3"; sessionIds never have an @

// ── FIELD ───────────────────────────────────────────────────────────────────────────
const HALF_W = CONFIG.fieldW / 2, R = CONFIG.radius, START = CONFIG.startZ, FINISH = CONFIG.finishZ, BOT_Z = FINISH - 9; // Hum-Bot stands behind the finish
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const dist = (a, b) => Math.hypot(a.x - b.x, a.z - b.z);
const angDiff = (a, b) => Math.atan2(Math.sin(a - b), Math.cos(a - b));
const clone = (o) => JSON.parse(JSON.stringify(o));
const rnd = (r) => r[0] + Math.random() * (r[1] - r[0]);
const hash = (s) => [...String(s)].reduce((n, ch) => (n * 31 + ch.charCodeAt(0)) >>> 0, 7);
/** Keep a body ({x, z}) inside the fences. */
function moveBody(o, dx, dz) { o.x = clamp(o.x + dx, -HALF_W + 0.6, HALF_W - 0.6); o.z = clamp(o.z + dz, FINISH - 6.5, START + 4); }

renderer.shadowMap.enabled = true;
renderer.shadowMap.autoUpdate = false; // only the field casts sun shadows, so draw them once
document.body.prepend(renderer.domElement);
const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(50, 1, 0.5, 300);

addEventListener("resize", fit); addEventListener("orientationchange", fit); fit();

  const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace; t.anisotropy = 4;
  if (rx) { t.wrapS = t.wrapT = THREE.RepeatWrapping; t.repeat.set(rx, ry); }

}
scene.background = canvasTex(4, 256, (c, w, h) => { const g = c.createLinearGradient(0, 0, 0, h); g.addColorStop(0, "#56b4ff"); g.addColorStop(0.6, "#bfe6ff"); g.addColorStop(1, "#f2fbff"); c.fillStyle = g; c.fillRect(0, 0, w, h); });
scene.fog = new THREE.Fog("#e2f4ff", 55, 150);
scene.add(new THREE.HemisphereLight("#eef8ff", "#6da04a", 1.5));
const sun = new THREE.DirectionalLight("#fff3dc", 2.0);
sun.position.set(14, 30, 12); sun.castShadow = true; sun.shadow.mapSize.set(1024, 1024);
Object.assign(sun.shadow.camera, { left: -40, right: 40, top: 45, bottom: -45, near: 1, far: 100 }); sun.shadow.bias = -0.0006;
scene.add(sun);
const mat = (color, more) => new THREE.MeshStandardMaterial({ color, roughness: 0.75, ...more });
const add = (geo, m, x, y, z, shadow = true) => { const o = new THREE.Mesh(geo, m); o.position.set(x, y, z); o.castShadow = shadow; o.receiveShadow = true; scene.add(o); return o; };
const M4 = new THREE.Matrix4(), Q = new THREE.Quaternion(), E3 = new THREE.Euler(), V3 = new THREE.Vector3(), SC = new THREE.Vector3();

{
  // grass all round, the mown field, chalk lines every 10 units
  const grass = canvasTex(64, 64, (c, w, h) => { c.fillStyle = "#79c055"; c.fillRect(0, 0, w, h); for (let i = 0; i < 300; i++) { c.fillStyle = Math.random() < 0.5 ? "#6fb54f" : "#86cc5f"; c.fillRect(Math.random() * w, Math.random() * h, 2, 2); } }, 40, 40);

  add(flat(new THREE.PlaneGeometry(CONFIG.fieldW + 1, len)), mat("#ffffff", { map: stripes, roughness: 1 }), 0, 0, (START + FINISH) / 2 - 2, false);
  const chalk = new THREE.MeshBasicMaterial({ color: "#ffffff", transparent: true, opacity: 0.45 });
  for (let z = FINISH + 10; z < START - 2; z += 10) add(flat(new THREE.PlaneGeometry(CONFIG.fieldW, 0.14)), chalk, 0, 0.012, z, false);
  // the start line, with START painted behind it
  add(flat(new THREE.PlaneGeometry(CONFIG.fieldW, 0.5)), mat("#ffffff"), 0, 0.015, START, false);
  add(flat(new THREE.PlaneGeometry(10, 2.5)), new THREE.MeshBasicMaterial({ map: textTex(512, 128, "START", "#ffffffd0", "", 110), transparent: true, depthWrite: false }), 0, 0.02, START + 2.2, false);

  const checks = canvasTex(256, 16, (c) => { for (let i = 0; i < 32; i++) for (let j = 0; j < 2; j++) { c.fillStyle = (i + j) % 2 ? "#ffffff" : "#ff3b55"; c.fillRect(i * 8, j * 8, 8, 8); } });

  add(new THREE.BoxGeometry(CONFIG.fieldW + 1.4, 1.0, 0.15), [mat("#ff3b55"), mat("#ff3b55"), mat("#ff3b55"), mat("#ff3b55"), mat("#ffffff", { map: banner }), mat("#ffffff", { map: banner })], 0, 4.0, FINISH);

// Particles: a ring buffer of little cubes (sparks, confetti, dust).

  if (stick.id >= 0) return;
  cv.setPointerCapture(e.pointerId);
  Object.assign(stick, { id: e.pointerId, ox: e.clientX, oy: e.clientY, mx: 0, mz: 0 });
  Object.assign($("stick").style, { left: e.clientX + "px", top: e.clientY + "px" }); $("stick").hidden = false;
});
cv.addEventListener("pointermove", (e) => {
  if (e.pointerType === "mouse") { mouse.nx = (e.clientX / innerWidth) * 2 - 1; mouse.ny = -(e.clientY / innerHeight) * 2 + 1; }
  if (e.pointerId !== stick.id) return;
  const dx = e.clientX - stick.ox, dy = e.clientY - stick.oy, d = Math.hypot(dx, dy), k = Math.min(1, d / 50) / (d || 1);
  stick.mx = dx * k; stick.mz = dy * k;
  $("stick").firstElementChild.style.transform = `translate(${stick.mx * 35}px, ${stick.mz * 35}px)`;
});
for (const ev of ["pointerup", "pointercancel"]) addEventListener(ev, (e) => { // on the window: letting go of the mouse over the results card or outside the page still stops you
  if (e.pointerType === "mouse") mouse.down = false;
  if (e.pointerId === stick.id) { Object.assign(stick, { id: -1, mx: 0, mz: 0 }); $("stick").hidden = true; }
});
document.addEventListener("touchmove", (e) => e.preventDefault(), { passive: false });

let AC = null;
function unlockAudio() { if (!AC && !ATTRACT) try { AC = new AudioContext(); } catch {} }
function tone(f, d, type, v, f2, delay = 0) {
  const t0 = AC.currentTime + Math.max(0, delay), o = AC.createOscillator(), g = AC.createGain();
  o.type = type; o.frequency.setValueAtTime(f, t0); o.frequency.exponentialRampToValueAtTime(f2, t0 + d);
  g.gain.setValueAtTime(0.0001, AC.currentTime); g.gain.setValueAtTime(v, t0); g.gain.exponentialRampToValueAtTime(0.001, t0 + d); o.connect(g).connect(AC.destination); o.start(AC.currentTime); o.stop(t0 + d + 0.02);
}
const hz = (m) => 440 * Math.pow(2, (m - 69) / 12);
function sound(kind) {
  if (!AC) return;
  if (kind === "turn") tone(220, CONFIG.turnMs / 1000, "sawtooth", 0.04, 520);
  if (kind === "look") { tone(880, 0.12, "square", 0.06, 880); tone(660, 0.18, "square", 0.06, 660, 0.14); }
  if (kind === "zap") { tone(1400, 0.35, "sawtooth", 0.08, 120); tone(90, 0.3, "square", 0.06, 50, 0.05); }
  if (kind === "safe") { tone(523, 0.3, "triangle", 0.14, 523); tone(659, 0.3, "triangle", 0.12, 659, 0.1); tone(1047, 0.5, "triangle", 0.12, 1047, 0.2); }
  if (kind === "go") tone(660, 0.3, "square", 0.08, 990);
  if (kind === "hiccup") tone(500, 0.25, "triangle", 0.12, 140);
}
/** Hum-Bot's song: queue each of the 8 notes just before it is due, on the shared clock. */
const song = { s: -1, next: 0, times: [], hic: false };
function playSong(g, t) {
  const w = g.w;
  if (g.phase !== "play" || w.k !== "sing") return;
  if (song.s !== w.s) Object.assign(song, { s: w.s, next: 0, times: noteTimes(w), hic: false });
  while (song.next < MELODY.length && song.times[song.next] < t + 120) {
    const i = song.next++, at = song.times[i];
    if (at < t - 80) continue; // joined mid-song: skip what already played
    floatNote();
    if (AC) { const d = (at - t) / 1000, len = i === MELODY.length - 1 ? 0.6 : Math.min(0.4, noteStep(w) / 1000 * 0.9); tone(hz(MELODY[i]), len, "triangle", 0.14, hz(MELODY[i]), d); tone(hz(MELODY[i] + 12), len * 0.6, "sine", 0.04, hz(MELODY[i] + 12), d); }
  }
  if (w.f && !song.hic && t >= w.a + w.f) { song.hic = true; sound("hiccup"); }
}

// ── MAIN LOOP ───────────────────────────────────────────────────────────────────────
let last = performance.now(), lastHb = 0, lastHud = 0;
const camLook = new THREE.Vector3(), camGoal = new THREE.Vector3();
function frame(now) {
  requestAnimationFrame(frame);
  if (performance.now() - lastTick > 1000) { hostHold = performance.now() + 700; host.was = false; host.last = null; } // the tab was frozen or in the background: someone else may have hosted meanwhile, so let its state arrive, then adopt it
  lastTick = performance.now(); // not the rAF time: after a long freeze Chrome can stamp the first frame from before it ended
  const dt = Math.max(0, Math.min(0.05, (now - last) / 1000)), sec = now / 1000; last = now;
  if (now - lastHb > 1000) { lastHb = now; net.me.set("hb", Date.now()); fixColor(); }
  if (isHost()) hostTick(dt, now); else host.was = false;
  const g = game();
  if (!g) { renderer.render(scene, camera); return; }
  const t = Date.now();
  myTick(dt, g, now);
  const all = people(g);
  effects(g, all, t);
  playSong(g, t);
  drawKids(g, all, now, sec);
  drawHumBot(g, t, dt, sec);
  drawParts(dt);
  moveCamera(all, dt);
  renderer.render(scene, camera);
  if (now - lastHud > 100) { lastHud = now; hud(g, all); }
}
function drawKids(g, all, now, sec) {
  const seen = new Set(), live = new Set(livePlayers()), t = Date.now();
  const poseOf = (id) => hash(id) + (g.phase === "play" ? phaseAt(g.w, t).s : 0);
  const draw = (v, id, s) => {
    v.g.position.set(s.x, 0, s.z); v.g.rotation.y = s.h;
    poseKid(v, s.a, poseOf(id), sec + (hash(id) % 100) * 0.01);
    if (s.a === 3 && Math.random() < 0.3) burst(s.x, 1 + Math.random(), s.z, ["#6fe8ff", "#ffffff"], 1, 4);
  };
  for (const [id, p] of Object.entries(S.entities.players || {})) {
    if (id === net.sessionId || !live.has(id)) continue;
    const q = posOf(id, p);
    if (!q || q.g !== g.id) continue;
    const s = sample(feed(id, p.p, q, now), now);
    seen.add(id); draw(viewOf(id, p.c || "#ccc", p.n || "Player"), id, s);
  }
  const host_ = isHost(), bots = host_ ? [...host.bots.values()] : botList(), raw = S.shared.bots;
  for (const b of bots) {
    const id = host_ ? b.id : b.i, s = host_ ? b : sample(feed(id, raw, b, now), now);
    seen.add(id); draw(viewOf(id, host_ ? b.color : b.c, host_ ? b.name : b.n), id, s);
  }
  for (const [id, v] of views) if (!seen.has(id)) { scene.remove(v.g); views.delete(id); tracks.delete(id); }
  if (!me.view) me.view = makeKid(myColor, "");
  draw(me.view, net.sessionId, me);
  if (!youRing.parent) scene.add(youRing);
  youRing.visible = !ATTRACT; youRing.position.set(me.x, 0.03, me.z); youRing.scale.setScalar(1.3 + Math.sin(sec * 4) * 0.08);
}
const youRing = new THREE.Mesh(flat(new THREE.RingGeometry(0.9, 1.0, 36)), new THREE.MeshBasicMaterial({ color: "#ffffff", transparent: true, opacity: 0.7, depthWrite: false }));
/** Low behind you, looking down the field at Hum-Bot (higher on a tall phone). ?attract follows the pack. */
function moveCamera(all, dt) {
  const tall = camera.aspect < 1;
  let fx = me.x * (tall ? 0.85 : 0.5), fz = me.z;
  if (ATTRACT) { const run = all.filter((c) => c.z > FINISH); fz = run.length ? run.reduce((s, c) => s + c.z, 0) / run.length : FINISH; fx = 0; }
  const hgt = ATTRACT ? 5.5 : tall ? 12 : 8, back = ATTRACT ? 9 : tall ? 14 : 11;
  camGoal.set(fx, 0, Math.max(fz, FINISH + 4));
  camLook.lerp(camGoal, 1 - Math.pow(ATTRACT ? 0.2 : 0.01, dt));
  shake = Math.max(0, shake - dt);
  camera.position.set(camLook.x + (Math.random() - 0.5) * shake, hgt, camLook.z + back + (Math.random() - 0.5) * shake);
  camera.lookAt(camLook.x * 0.6, ATTRACT ? 3.2 : 1.2, camLook.z - (ATTRACT ? 14 : 12));
}

(async function start() {
  renderer.shadowMap.needsUpdate = true;
  net = await connect();
  me.id = net.sessionId;
  net.onState((st) => { S = st; });
  net.on("again", () => { const g = game(); if (isHost() && g && g.phase === "over") host.again = true; });
  net.onDisconnect(() => { reconnecting = true; $("net").textContent = "Reconnecting…"; });
  net.onReconnect(() => { reconnecting = false; });
  if (!net.offline && typeof MP !== "undefined") board = MP.auth({ key: MP_CONNECT.key, apiUrl: MP_CONNECT.apiUrl }).leaderboard(CONFIG.board);
  const taken = new Set(Object.entries(S.entities.players || {}).filter(([id]) => id !== net.sessionId).map(([, p]) => p.c));
  myColor = COLORS.find((c) => !taken.has(c)) || COLORS[Math.floor(Math.random() * COLORS.length)];
  net.me.set({ n: myName, c: myColor, hb: Date.now() });
  camLook.set(0, 0, START);
  if (QS.has("test")) window.__test = { game, me, isHost, people: () => people(game()), phaseAt, lookSeq }; // for test scripts only
  requestAnimationFrame(frame);
})();
</script>
